{% extends "base.html" %}
{% block title %}Log in — StudentAssign{% endblock %}
{% block content %}
<h1>Log in</h1>
<form class="stack" method="POST">
  <div>
    <label>Email</label>
    <input type="email" name="email" required autofocus>
  </div>
  <div>
    <label>Password</label>
    <input type="password" name="password" required>
  </div>
  <button class="btn btn-amber" type="submit">Log in</button>
</form>
<p class="muted" style="margin-top:14px;">No account yet? <a href="{{ url_for('register') }}">Sign up</a></p>
{% endblock %}
