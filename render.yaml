services:
  - type: web
    name: studentassign
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT"
    initialDeployHook: "python seed.py"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: studentassign-db
          property: connectionString

databases:
  - name: studentassign-db
    plan: free
