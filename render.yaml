services:
  - type: web
    name: studentassign
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'app:create_app()'"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: studentassign-db
          property: connectionString

databases:
  - name: studentassign-db
    plan: free
